name: Tournament of Towns PDFs
on:
  workflow_dispatch:
    inputs:
      max_new_calls:
        description: Maximum new real OpenRouter calls approved for this run
        required: true
        type: number
        default: 0
jobs:
  run:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Process archive with real calls only when approved
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          MAX_NEW_CALLS: ${{ inputs.max_new_calls }}
        run: python -m tournament_agent.main
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-output
          path: |
            data/archive.sqlite
            output/**/*.pdf
            data/crops/*.png
